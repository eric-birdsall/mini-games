<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#3b2f78"/><stop offset=".55" stop-color="#7b4aa8"/><stop offset=".85" stop-color="#ff9a6b"/><stop offset="1" stop-color="#ffd59a"/></linearGradient>
    <linearGradient id="snow" x2="0" y2="1"><stop stop-color="#f4f8ff"/><stop offset="1" stop-color="#dfe8fb"/></linearGradient>
    <radialGradient id="fb" cx="40%" cy="40%"><stop stop-color="#fff6a8"/><stop offset=".45" stop-color="#ffb02e"/><stop offset="1" stop-color="#e8401c"/></radialGradient>
    <linearGradient id="is" x2="0" y2="1"><stop stop-color="#e9fbff"/><stop offset="1" stop-color="#3a9be8"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <g id="critter">
      <rect x="66" y="232" width="26" height="54" rx="12"/>
      <rect x="108" y="232" width="26" height="54" rx="12"/>
      <ellipse cx="100" cy="192" rx="60" ry="52"/>
      <ellipse cx="42" cy="186" rx="14" ry="26" transform="rotate(18 42 186)"/>
      <ellipse cx="158" cy="186" rx="14" ry="26" transform="rotate(-18 158 186)"/>
      <circle cx="100" cy="98" r="52"/>
      <circle cx="86" cy="100" r="11" fill="#fff"/>
      <circle cx="122" cy="100" r="11" fill="#fff"/>
      <circle cx="90" cy="99" r="5" fill="#1d1838"/>
      <circle cx="126" cy="99" r="5" fill="#1d1838"/>
      <circle cx="72" cy="120" r="8" fill="#ff8fa8" opacity=".7"/>
      <circle cx="136" cy="120" r="8" fill="#ff8fa8" opacity=".7"/>
      <path d="M94 124 Q104 134 114 124" fill="none" stroke="#1d1838" stroke-width="5" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="600" cy="130" r="58" fill="#fff7d8"/>
  <ellipse cx="250" cy="640" rx="520" ry="230" fill="#b6c4ec"/>
  <ellipse cx="1000" cy="660" rx="560" ry="200" fill="#c9d6f4"/>
  <path d="M0 610 Q600 540 1200 610 V800 H0 Z" fill="url(#snow)"/>
  <!-- You: green critter, red hat -->
  <g transform="translate(250 250) scale(1.45)">
    <use href="#critter" fill="#42c59a"/>
    <ellipse cx="100" cy="200" rx="36" ry="32" fill="#c8f5df"/>
    <path d="M52 66 L100 4 L148 66 Z" fill="#e5532f"/>
    <rect x="46" y="60" width="108" height="12" rx="6" fill="#ffd23a"/>
  </g>
  <!-- Computer: purple critter, blue hat, facing left -->
  <g transform="translate(950 250) scale(-1.45 1.45)">
    <use href="#critter" fill="#8b6be8"/>
    <ellipse cx="100" cy="200" rx="36" ry="32" fill="#e2d8ff"/>
    <path d="M52 66 L100 2 L148 66 Z" fill="#2f86d6"/>
    <rect x="46" y="60" width="108" height="12" rx="6" fill="#b8ecff"/>
  </g>
  <!-- Ice shield in front of the computer's head -->
  <g transform="translate(660 285)">
    <path d="M70 6 L128 26 C128 80 108 116 70 136 C32 116 12 80 12 26 Z" fill="#8fdcff" filter="url(#glow)" opacity=".8"/>
    <path d="M70 6 L128 26 C128 80 108 116 70 136 C32 116 12 80 12 26 Z" fill="url(#is)" stroke="#fff" stroke-width="7"/>
    <g stroke="#fff" stroke-width="7" stroke-linecap="round"><path d="M70 42v56M46 56l48 28M46 84l48-28"/></g>
  </g>
  <!-- Fire ball flying at it -->
  <g transform="translate(500 330)">
    <path d="M-150 10 Q-80 -10 -20 0 Q-80 30 -150 10Z" fill="#ffb02e" opacity=".55"/>
    <circle r="62" fill="#ff8a3a" filter="url(#glow)"/>
    <path d="M0 -60 C14 -40 32 -42 30 -16 C44 -20 42 2 38 10 A40 40 0 1 1 -38 6 C-42 -8 -36 -20 -26 -22 C-28 -36 -12 -42 0 -60 Z" fill="url(#fb)"/>
    <circle cx="0" cy="8" r="20" fill="#fff6a8" opacity=".85"/>
  </g>
</svg>
